# Integration tests run against an in-memory H2 database (Oracle is not needed).
spring.datasource.url=jdbc:h2:mem:rgtest;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=test-only
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
refundguard.razorpay.webhook-secret=
refundguard.security.bootstrap.admin-password=Rg-Test-Pass-A-1234
refundguard.security.bootstrap.operator-password=Rg-Test-Pass-O-1234
refundguard.security.bootstrap.reviewer-password=Rg-Test-Pass-R-1234
refundguard.sla.initial-delay-ms=3600000
