server.port=8080

# Oracle 21c Database Connection
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=refundguard
# No default: set SPRING_DATASOURCE_PASSWORD (see .env.example). The app refuses to start without it.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate & JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow File Uploads (Settlement CSVs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger OpenAPI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─────────────────────────────────────────────────────────────
# RBI TAT / SLA engine
# Deadline = end of calendar day (T + tat-days), T = day the refund was initiated.
# Defaults follow the RBI TAT circular (RBI/2019-20/67, 20 Sep 2019) for failed
# transactions: UPI/IMPS T+1, card/PPI(wallet) T+5, Rs 100 per day of delay.
# For voluntary merchant refunds, align these with your gateway agreement.
# ─────────────────────────────────────────────────────────────
refundguard.sla.tat-days.upi=1
refundguard.sla.tat-days.imps=1
refundguard.sla.tat-days.neft=1
refundguard.sla.tat-days.rtgs=1
refundguard.sla.tat-days.card=5
refundguard.sla.tat-days.wallet=5
refundguard.sla.tat-days.netbanking=5
refundguard.sla.compensation-per-day.upi=100
refundguard.sla.compensation-per-day.imps=100
refundguard.sla.compensation-per-day.neft=100
refundguard.sla.compensation-per-day.rtgs=100
refundguard.sla.compensation-per-day.card=100
refundguard.sla.compensation-per-day.wallet=100
refundguard.sla.compensation-per-day.netbanking=100
refundguard.sla.default-tat-days=5
refundguard.sla.default-compensation-per-day=100
# How often the background SLA check runs (ms)
refundguard.sla.check-interval-ms=300000
refundguard.sla.initial-delay-ms=60000

# ─────────────────────────────────────────────────────────────
# Razorpay webhook signature verification (HMAC-SHA256).
# Must equal the secret configured in Razorpay Dashboard → Webhooks.
# Empty = all webhooks rejected (fail closed).
# ─────────────────────────────────────────────────────────────
refundguard.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ─────────────────────────────────────────────────────────────
# Claude AI root-cause analysis. Empty key = rule-based analysis only.
# ─────────────────────────────────────────────────────────────
refundguard.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
refundguard.ai.model=${REFUNDGUARD_AI_MODEL:claude-opus-5-5}

# ─────────────────────────────────────────────────────────────
# Security (RBAC). Roles: OPERATOR, REVIEWER, ADMIN. No default password exists:
# if RG_ADMIN_PASSWORD is empty on first start, a random one is generated and logged once.
# ─────────────────────────────────────────────────────────────
refundguard.security.bootstrap.admin-username=${RG_ADMIN_USERNAME:admin}
refundguard.security.bootstrap.admin-password=${RG_ADMIN_PASSWORD:}
refundguard.security.bootstrap.operator-password=${RG_OPERATOR_PASSWORD:}
refundguard.security.bootstrap.reviewer-password=${RG_REVIEWER_PASSWORD:}

# Demo/simulator endpoints (cancel-order, fail-refund, age-refund, reset ...). Set false for production-like runs.
refundguard.simulator.enabled=${RG_SIMULATOR_ENABLED:true}

# ─────────────────────────────────────────────────────────────
# Rule-based refund risk scoring (0-100). NOT a machine-learning model.
# Any value can be overridden by env var, e.g. REFUNDGUARD_RISK_HOLD_MIN_SCORE=60
# ─────────────────────────────────────────────────────────────
refundguard.risk.high-amount=25000
refundguard.risk.high-amount-weight=20
refundguard.risk.very-high-amount=100000
refundguard.risk.very-high-amount-weight=35
refundguard.risk.exceeds-order-weight=40
refundguard.risk.multiple-refunds-for-order-weight=30
# Missing order data is reported as 'unavailable', not scored (0). Raise only if your policy treats it as risk.
refundguard.risk.order-not-found-weight=0
refundguard.risk.open-discrepancy-weight=15
# Several refunds for one order whose total exceeds the order amount (policy violation; replaces multiple-refunds weight)
refundguard.risk.cumulative-exceeds-order-weight=40
# Refund currency differs from the order/payment currency (policy violation)
refundguard.risk.order-currency-mismatch-weight=30
# Bank settlement vs refund: over-credit (possible over-refund), short credit (often operational), several UTRs
refundguard.risk.settlement-over-credit-weight=45
refundguard.risk.settlement-shortfall-weight=20
refundguard.risk.duplicate-settlement-weight=40
refundguard.risk.repeated-attempts-threshold=2
refundguard.risk.repeated-attempts-weight=15
refundguard.risk.repeated-attempts-high-threshold=3
refundguard.risk.repeated-attempts-high-weight=25
refundguard.risk.customer-window-days=7
refundguard.risk.customer-frequency-threshold=3
refundguard.risk.customer-frequency-weight=20
refundguard.risk.customer-frequency-high-threshold=5
refundguard.risk.customer-frequency-high-weight=30
refundguard.risk.customer-window-total=100000
refundguard.risk.customer-window-total-weight=15
# Score bands: LOW 0-29, MEDIUM 30-59, HIGH 60-79, CRITICAL 80-100
refundguard.risk.medium-min=30
refundguard.risk.high-min=60
refundguard.risk.critical-min=80
# Hold-and-release: refunds scoring >= hold-min-score are held for REVIEWER/ADMIN approval.
refundguard.risk.hold-enabled=true
refundguard.risk.hold-min-score=${REFUNDGUARD_RISK_HOLD_MIN_SCORE:50}
# An assessment older than this is reported as stale.
refundguard.risk.max-age-minutes=1440
# Policy violations (refund above refundable amount, currency mismatch) are held for reviewer approval whatever the score
refundguard.risk.hold-on-policy-violation=true
# Repeated manual reassessments with unchanged inputs inside this window reuse the latest assessment
refundguard.risk.reassess-dedupe-seconds=60
